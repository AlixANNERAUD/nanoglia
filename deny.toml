# cargo-deny: licenses, security advisories, banned and duplicated crates, sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# MPL-2.0: one file of nanoglia-kernels, `src/eigen.rs`, ported from Eigen.
allow = ["Apache-2.0", "MIT", "MPL-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
