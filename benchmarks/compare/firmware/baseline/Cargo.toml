[package]
name = "fw-baseline"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
build = "../build.rs"
description = "The comparison firmware without any engine: cortex-m-rt, panic-halt, the static input and the result symbols."

[dependencies]
fw-common = { path = "../common" }
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
panic-halt = { workspace = true }
