[package]
name = "nanoglia-core"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tensor, operator, error and kernel-backend types shared by the nanoglia crates, plus TFLite-exact quantization math and an arena allocator."
documentation = "https://docs.rs/nanoglia-core"
readme = "README.md"
keywords = ["neural-network", "no-std", "embedded", "tinyml", "inference"]
categories = ["science", "embedded", "no-std", "no-std::no-alloc"]

[features]
default = []
## Enables `allocator_api2::alloc::Global` (the Rust global allocator).
alloc = ["allocator-api2/alloc"]
## Requantize with single rounding (`TFLITE_SINGLE_ROUNDING`) instead of the double rounding of
## TensorFlow Lite Micro and CMSIS-NN.
single-rounding = []
## Implements `defmt::Format` for the error types.
defmt = ["dep:defmt"]

[dependencies]
allocator-api2 = { workspace = true }
defmt = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
