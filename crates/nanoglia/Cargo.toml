[package]
name = "nanoglia"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Run TensorFlow Lite models loaded at runtime on microcontrollers: one no_std API, CMSIS-NN / ESP-NN accelerated kernels, every byte from your allocator."
documentation = "https://docs.rs/nanoglia"
readme = "README.md"
keywords = ["neural-network", "no-std", "embedded", "tinyml", "tflite"]
categories = ["science", "embedded", "no-std", "no-std::no-alloc"]

[features]
default = ["cmsis-nn", "kernels", "float", "int16", "all-ops"]
## Use the Rust global allocator (`Graph::load`, `Graph::init_execution_context`).
alloc = ["nanoglia-core/alloc"]
## CMSIS-NN kernels: Arm DSP/Helium on Cortex-M, portable C elsewhere.
cmsis-nn = ["dep:nanoglia-cmsis-nn"]
## ESP-NN kernels, tried first: ESP32-S3 optimized on `xtensa-esp32s3` targets, ANSI C elsewhere
## (slower than CMSIS-NN's portable C: enable it on other targets for testing only). Falls back to
## CMSIS-NN when another context is running ESP-NN.
esp-nn = ["dep:nanoglia-esp-nn"]
## Pure Rust kernels for the operators CMSIS-NN lacks, and float32.
kernels = ["dep:nanoglia-kernels"]
## float32 operators (needs `kernels`). Leave it out of int8-only firmware to save flash.
float = ["nanoglia-kernels?/float"]
## int16 (16x8) operators. Leave it out of int8-only firmware to save flash.
int16 = ["nanoglia-cmsis-nn?/int16", "nanoglia-kernels?/int16"]
## Requantize with single rounding (`TFLITE_SINGLE_ROUNDING`, faster) instead of the double
## rounding of TensorFlow Lite Micro, CMSIS-NN and the TFLite reference kernels.
single-rounding = ["nanoglia-core/single-rounding", "nanoglia-cmsis-nn?/single-rounding", "nanoglia-kernels?/single-rounding"]
## `defmt::Format` for the error types.
defmt = ["nanoglia-core/defmt"]
## Every operator: all the `op-*` features below. On by default; a firmware that turns the default
## features off lists the operators of its models instead, and links only their kernels.
all-ops = [
  "op-abs", "op-add", "op-arg-max", "op-arg-min", "op-average-pool-2d", "op-batch-to-space-nd",
  "op-cast", "op-concatenation", "op-conv-2d", "op-depthwise-conv-2d", "op-depth-to-space",
  "op-dequantize", "op-div", "op-equal", "op-exp", "op-expand-dims", "op-fully-connected",
  "op-gather", "op-greater", "op-greater-equal", "op-hard-swish", "op-leaky-relu", "op-less",
  "op-less-equal", "op-log", "op-logistic", "op-maximum", "op-max-pool-2d", "op-mean",
  "op-minimum", "op-mul", "op-neg", "op-not-equal", "op-pack", "op-pad", "op-padv2", "op-prelu",
  "op-quantize", "op-reduce-max", "op-reduce-min", "op-relu", "op-relu6", "op-relu-n1-to-1",
  "op-reshape", "op-resize-bilinear", "op-resize-nearest-neighbor", "op-rsqrt", "op-select-v2",
  "op-slice", "op-softmax", "op-space-to-batch-nd", "op-space-to-depth", "op-split", "op-split-v",
  "op-sqrt", "op-squared-difference", "op-squeeze", "op-strided-slice", "op-sub", "op-sum",
  "op-tanh", "op-transpose", "op-transpose-conv", "op-unpack",
]
# One feature per operator (`BuiltinOp::feature`), forwarded to every enabled backend that has
# kernels for it: without it no backend claims the operator (loading a model that uses it fails
# with `UnsupportedOp`) and its kernels are not linked. The float32 and int16 kernels of an
# operator need `float` and `int16` too. `crates/nanoglia-tools/tests/op_features.rs` checks this list against the
# backends.
op-abs = ["nanoglia-kernels?/op-abs"]
op-add = ["nanoglia-cmsis-nn?/op-add", "nanoglia-esp-nn?/op-add", "nanoglia-kernels?/op-add"]
op-arg-max = ["nanoglia-kernels?/op-arg-max"]
op-arg-min = ["nanoglia-kernels?/op-arg-min"]
op-average-pool-2d = ["nanoglia-cmsis-nn?/op-average-pool-2d", "nanoglia-esp-nn?/op-average-pool-2d", "nanoglia-kernels?/op-average-pool-2d"]
op-batch-to-space-nd = ["nanoglia-kernels?/op-batch-to-space-nd"]
op-cast = ["nanoglia-kernels?/op-cast"]
op-concatenation = ["nanoglia-kernels?/op-concatenation"]
op-conv-2d = ["nanoglia-cmsis-nn?/op-conv-2d", "nanoglia-esp-nn?/op-conv-2d", "nanoglia-kernels?/op-conv-2d"]
op-depthwise-conv-2d = ["nanoglia-cmsis-nn?/op-depthwise-conv-2d", "nanoglia-esp-nn?/op-depthwise-conv-2d", "nanoglia-kernels?/op-depthwise-conv-2d"]
op-depth-to-space = ["nanoglia-kernels?/op-depth-to-space"]
op-dequantize = ["nanoglia-kernels?/op-dequantize"]
op-div = ["nanoglia-kernels?/op-div"]
op-equal = ["nanoglia-kernels?/op-equal"]
op-exp = ["nanoglia-kernels?/op-exp"]
op-expand-dims = ["nanoglia-kernels?/op-expand-dims"]
op-fully-connected = ["nanoglia-cmsis-nn?/op-fully-connected", "nanoglia-esp-nn?/op-fully-connected", "nanoglia-kernels?/op-fully-connected"]
op-gather = ["nanoglia-kernels?/op-gather"]
op-greater = ["nanoglia-kernels?/op-greater"]
op-greater-equal = ["nanoglia-kernels?/op-greater-equal"]
op-hard-swish = ["nanoglia-kernels?/op-hard-swish"]
op-leaky-relu = ["nanoglia-kernels?/op-leaky-relu"]
op-less = ["nanoglia-kernels?/op-less"]
op-less-equal = ["nanoglia-kernels?/op-less-equal"]
op-log = ["nanoglia-kernels?/op-log"]
op-logistic = ["nanoglia-kernels?/op-logistic"]
op-maximum = ["nanoglia-cmsis-nn?/op-maximum", "nanoglia-kernels?/op-maximum"]
op-max-pool-2d = ["nanoglia-cmsis-nn?/op-max-pool-2d", "nanoglia-esp-nn?/op-max-pool-2d", "nanoglia-kernels?/op-max-pool-2d"]
op-mean = ["nanoglia-kernels?/op-mean"]
op-minimum = ["nanoglia-cmsis-nn?/op-minimum", "nanoglia-kernels?/op-minimum"]
op-mul = ["nanoglia-cmsis-nn?/op-mul", "nanoglia-esp-nn?/op-mul", "nanoglia-kernels?/op-mul"]
op-neg = ["nanoglia-kernels?/op-neg"]
op-not-equal = ["nanoglia-kernels?/op-not-equal"]
op-pack = ["nanoglia-kernels?/op-pack"]
op-pad = ["nanoglia-cmsis-nn?/op-pad", "nanoglia-kernels?/op-pad"]
op-padv2 = ["nanoglia-cmsis-nn?/op-padv2", "nanoglia-kernels?/op-padv2"]
op-prelu = ["nanoglia-kernels?/op-prelu"]
op-quantize = ["nanoglia-kernels?/op-quantize"]
op-reduce-max = ["nanoglia-kernels?/op-reduce-max"]
op-reduce-min = ["nanoglia-kernels?/op-reduce-min"]
op-relu = ["nanoglia-kernels?/op-relu"]
op-relu6 = ["nanoglia-kernels?/op-relu6"]
op-relu-n1-to-1 = ["nanoglia-kernels?/op-relu-n1-to-1"]
op-reshape = ["nanoglia-kernels?/op-reshape"]
op-resize-bilinear = ["nanoglia-kernels?/op-resize-bilinear"]
op-resize-nearest-neighbor = ["nanoglia-kernels?/op-resize-nearest-neighbor"]
op-rsqrt = ["nanoglia-kernels?/op-rsqrt"]
op-select-v2 = ["nanoglia-kernels?/op-select-v2"]
op-slice = ["nanoglia-kernels?/op-slice"]
op-softmax = ["nanoglia-cmsis-nn?/op-softmax", "nanoglia-esp-nn?/op-softmax", "nanoglia-kernels?/op-softmax"]
op-space-to-batch-nd = ["nanoglia-kernels?/op-space-to-batch-nd"]
op-space-to-depth = ["nanoglia-kernels?/op-space-to-depth"]
op-split = ["nanoglia-kernels?/op-split"]
op-split-v = ["nanoglia-kernels?/op-split-v"]
op-sqrt = ["nanoglia-kernels?/op-sqrt"]
op-squared-difference = ["nanoglia-kernels?/op-squared-difference"]
op-squeeze = ["nanoglia-kernels?/op-squeeze"]
op-strided-slice = ["nanoglia-kernels?/op-strided-slice"]
op-sub = ["nanoglia-kernels?/op-sub"]
op-sum = ["nanoglia-kernels?/op-sum"]
op-tanh = ["nanoglia-kernels?/op-tanh"]
op-transpose = ["nanoglia-kernels?/op-transpose"]
op-transpose-conv = ["nanoglia-cmsis-nn?/op-transpose-conv", "nanoglia-kernels?/op-transpose-conv"]
op-unpack = ["nanoglia-kernels?/op-unpack"]

[dependencies]
nanoglia-core = { workspace = true }
nanoglia-tflite = { workspace = true }
nanoglia-cmsis-nn = { workspace = true, optional = true, default-features = false }
nanoglia-esp-nn = { workspace = true, optional = true, default-features = false }
nanoglia-kernels = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
nanoglia-core = { workspace = true, features = ["alloc"] }
nanoglia-tflite = { workspace = true }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[[test]]
name = "ownership"
required-features = ["alloc"]

# Adapts to the `op-*` features it is built with, but needs the two backends the MLPerf Tiny
# models run on, and int8 kernels only.
[[test]]
name = "operator_subset"
required-features = ["cmsis-nn", "kernels"]
