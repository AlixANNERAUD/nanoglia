[package]
name = "nanoglia-tools"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Check on a computer whether nanoglia runs a TensorFlow Lite model: the kernel of every operator, every operator that blocks, and the memory needed."
readme = "README.md"
keywords = ["neural-network", "embedded", "tinyml", "tflite", "cli"]
categories = ["command-line-utilities", "science", "embedded"]

[[bin]]
name = "nanoglia"
path = "src/main.rs"
# The library `nanoglia` owns the rustdoc page of that name.
doc = false

[features]
default = ["float", "int16"]
## Check with the float32 kernels (feature `float` of `nanoglia`).
float = ["nanoglia-kernels/float"]
## Check with the int16 (16x8) kernels (feature `int16` of `nanoglia`).
int16 = ["nanoglia-cmsis-nn/int16", "nanoglia-kernels/int16"]
## Check with single-rounding requantization (feature `single-rounding` of `nanoglia`): ESP-NN
## then claims no operator.
single-rounding = ["nanoglia/single-rounding", "nanoglia-cmsis-nn/single-rounding", "nanoglia-kernels/single-rounding"]

# The three backends are always built and chosen at run time (`--backends`), in a registry of the
# tool's own: no feature of `nanoglia` is enabled, so building the tool with the workspace does
# not change the default registry the other crates are tested with. No other dependency:
# arguments and JSON are handled by hand (five options, one flat document).
[dependencies]
nanoglia = { workspace = true }
nanoglia-cmsis-nn = { workspace = true }
nanoglia-esp-nn = { workspace = true }
nanoglia-kernels = { workspace = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
