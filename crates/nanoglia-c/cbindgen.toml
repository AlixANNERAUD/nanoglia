# Generates include/nanoglia.h from src/lib.rs: `mise run header`. The header is committed;
# `mise run test-c` fails if it is not up to date.
language = "C"
header = """
/**
 * @file nanoglia.h
 * @brief Run TensorFlow Lite models loaded at run time, with every byte in one buffer you provide.
 *
 * Compute the size of the buffer with nanoglia_memory_requirements(), load the model into it with
 * nanoglia_load(), write the inputs (nanoglia_input()), run nanoglia_compute() or nanoglia_step()
 * until done, read the outputs (nanoglia_output()), and nanoglia_release() the handle. Nothing is
 * allocated. Every function checks its arguments and returns a status; a malformed model returns an
 * error, never crashes.
 *
 * A handle is used by one thread at a time; handles in different buffers are independent.
 */"""
autogen_warning = "/* Generated by cbindgen from crates/nanoglia-c/src/lib.rs (`mise run header`): do not edit. */"
include_guard = "NANOGLIA_H"
cpp_compat = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

[export.rename]
"Status" = "nanoglia_status"
"DetailKind" = "nanoglia_detail"
"ErrorInfo" = "nanoglia_error"
"Memory" = "nanoglia_memory"
"ElementType" = "nanoglia_type"
"Tensor" = "nanoglia_tensor"
"Nanoglia" = "nanoglia"
"MAX_RANK" = "NANOGLIA_MAX_RANK"
"MODEL_ALIGNMENT" = "NANOGLIA_MODEL_ALIGNMENT"
"BACKEND_NAME_SIZE" = "NANOGLIA_BACKEND_NAME_SIZE"

[enum]
# NANOGLIA_STATUS_OK, NANOGLIA_DETAIL_NONE, NANOGLIA_TYPE_INT8...
rename_variants = "QualifiedScreamingSnakeCase"
