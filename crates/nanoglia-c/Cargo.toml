[package]
name = "nanoglia-c"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "C API of nanoglia: run TensorFlow Lite models loaded at runtime from C or C++, with every byte in one buffer you provide, as a static library with a header and a CMake project."
documentation = "https://docs.rs/nanoglia-c"
readme = "README.md"
keywords = ["neural-network", "ffi", "embedded", "tinyml", "tflite"]
categories = ["science", "embedded", "no-std", "no-std::no-alloc", "external-ffi-bindings"]

# Only an rlib: Cargo builds every crate type listed here, also when the crate is a dependency,
# and a `staticlib` needs a panic handler (or `std`). The C library is built with
# `cargo rustc --crate-type staticlib`, as the CMake project does; a firmware with other Rust
# libraries depends on this rlib from its own staticlib crate, with its own panic handler.
[lib]
name = "nanoglia_c"

[features]
default = ["cmsis-nn", "kernels", "float", "int16", "all-ops"]
## Link the standard library: its panic handler, and panics are caught at the C boundary
## (`NANOGLIA_STATUS_UNKNOWN`). Needed to build the static library for a target with `std` (the host).
std = []
## A panic handler that loops forever, for a static library built for a target without `std`.
## Leave it out when another crate of the program provides the panic handler.
panic-handler = []
## CMSIS-NN kernels: Arm DSP/Helium on Cortex-M, portable C elsewhere.
cmsis-nn = ["nanoglia/cmsis-nn"]
## ESP-NN kernels, tried first: ESP32-S3 optimized on `xtensa-esp32s3` targets.
esp-nn = ["nanoglia/esp-nn"]
## Pure Rust kernels for the operators CMSIS-NN lacks, and float32.
kernels = ["nanoglia/kernels"]
## float32 operators (needs `kernels`).
float = ["nanoglia/float"]
## int16 (16x8) operators.
int16 = ["nanoglia/int16"]
## Single-rounding requantization (`TFLITE_SINGLE_ROUNDING`).
single-rounding = ["nanoglia/single-rounding"]
## Every operator: all the `op-*` features below. On by default; a firmware that turns the default
## features off lists the operators of its models instead, and links only their kernels.
all-ops = ["nanoglia/all-ops"]
# One feature per operator, those of `nanoglia`: without it no backend claims the operator
# (`NANOGLIA_STATUS_UNSUPPORTED_OPERATION` when loading a model that uses it) and its kernels are not
# linked.
op-abs = ["nanoglia/op-abs"]
op-add = ["nanoglia/op-add"]
op-arg-max = ["nanoglia/op-arg-max"]
op-arg-min = ["nanoglia/op-arg-min"]
op-average-pool-2d = ["nanoglia/op-average-pool-2d"]
op-batch-to-space-nd = ["nanoglia/op-batch-to-space-nd"]
op-cast = ["nanoglia/op-cast"]
op-concatenation = ["nanoglia/op-concatenation"]
op-conv-2d = ["nanoglia/op-conv-2d"]
op-depthwise-conv-2d = ["nanoglia/op-depthwise-conv-2d"]
op-depth-to-space = ["nanoglia/op-depth-to-space"]
op-dequantize = ["nanoglia/op-dequantize"]
op-div = ["nanoglia/op-div"]
op-equal = ["nanoglia/op-equal"]
op-exp = ["nanoglia/op-exp"]
op-expand-dims = ["nanoglia/op-expand-dims"]
op-fully-connected = ["nanoglia/op-fully-connected"]
op-gather = ["nanoglia/op-gather"]
op-greater = ["nanoglia/op-greater"]
op-greater-equal = ["nanoglia/op-greater-equal"]
op-hard-swish = ["nanoglia/op-hard-swish"]
op-leaky-relu = ["nanoglia/op-leaky-relu"]
op-less = ["nanoglia/op-less"]
op-less-equal = ["nanoglia/op-less-equal"]
op-log = ["nanoglia/op-log"]
op-logistic = ["nanoglia/op-logistic"]
op-maximum = ["nanoglia/op-maximum"]
op-max-pool-2d = ["nanoglia/op-max-pool-2d"]
op-mean = ["nanoglia/op-mean"]
op-minimum = ["nanoglia/op-minimum"]
op-mul = ["nanoglia/op-mul"]
op-neg = ["nanoglia/op-neg"]
op-not-equal = ["nanoglia/op-not-equal"]
op-pack = ["nanoglia/op-pack"]
op-pad = ["nanoglia/op-pad"]
op-padv2 = ["nanoglia/op-padv2"]
op-prelu = ["nanoglia/op-prelu"]
op-quantize = ["nanoglia/op-quantize"]
op-reduce-max = ["nanoglia/op-reduce-max"]
op-reduce-min = ["nanoglia/op-reduce-min"]
op-relu = ["nanoglia/op-relu"]
op-relu6 = ["nanoglia/op-relu6"]
op-relu-n1-to-1 = ["nanoglia/op-relu-n1-to-1"]
op-reshape = ["nanoglia/op-reshape"]
op-resize-bilinear = ["nanoglia/op-resize-bilinear"]
op-resize-nearest-neighbor = ["nanoglia/op-resize-nearest-neighbor"]
op-rsqrt = ["nanoglia/op-rsqrt"]
op-select-v2 = ["nanoglia/op-select-v2"]
op-slice = ["nanoglia/op-slice"]
op-softmax = ["nanoglia/op-softmax"]
op-space-to-batch-nd = ["nanoglia/op-space-to-batch-nd"]
op-space-to-depth = ["nanoglia/op-space-to-depth"]
op-split = ["nanoglia/op-split"]
op-split-v = ["nanoglia/op-split-v"]
op-sqrt = ["nanoglia/op-sqrt"]
op-squared-difference = ["nanoglia/op-squared-difference"]
op-squeeze = ["nanoglia/op-squeeze"]
op-strided-slice = ["nanoglia/op-strided-slice"]
op-sub = ["nanoglia/op-sub"]
op-sum = ["nanoglia/op-sum"]
op-tanh = ["nanoglia/op-tanh"]
op-transpose = ["nanoglia/op-transpose"]
op-transpose-conv = ["nanoglia/op-transpose-conv"]
op-unpack = ["nanoglia/op-unpack"]

[dependencies]
nanoglia = { workspace = true }

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
