[tools]
# `targets` are the cross targets of the `cross-*` tasks. `mr_boxington` routes
# Cargo through mbx, a shared build cache: the C objects of CMSIS-NN and ESP-NN
# and the build-script outputs are restored instead of recompiled.
rust = { version = "stable", components = "rustfmt,clippy,llvm-tools", targets = "thumbv6m-none-eabi,thumbv7em-none-eabihf,thumbv8m.main-none-eabihf,riscv32imc-unknown-none-elf,wasm32-unknown-unknown,wasm32-wasip1", mr_boxington = true }
mr-boxington = "latest"
uv = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"

# C toolchains for the embedded cross builds (`mise bootstrap packages apply`).
[bootstrap.packages]
"apt:gcc-arm-none-eabi" = { os = "linux" }
"apt:libnewlib-arm-none-eabi" = { os = "linux" }
"apt:gcc-riscv64-unknown-elf" = { os = "linux" }
"apt:picolibc-riscv64-unknown-elf" = { os = "linux" }

# How `cc` finds those toolchains (Debian/Ubuntu paths). Only the C headers are
# used (stdint.h, string.h...): nothing links the C library.
[env]
CC_thumbv6m_none_eabi = "arm-none-eabi-gcc"
AR_thumbv6m_none_eabi = "arm-none-eabi-ar"
CFLAGS_thumbv6m_none_eabi = "-isystem /usr/include/newlib"
CC_thumbv7em_none_eabihf = "arm-none-eabi-gcc"
AR_thumbv7em_none_eabihf = "arm-none-eabi-ar"
CFLAGS_thumbv7em_none_eabihf = "-isystem /usr/include/newlib"
CC_riscv32imc_unknown_none_elf = "riscv64-unknown-elf-gcc"
AR_riscv32imc_unknown_none_elf = "riscv64-unknown-elf-ar"
CFLAGS_riscv32imc_unknown_none_elf = "-isystem /usr/lib/picolibc/riscv64-unknown-elf/include"
# thumbv8m.main has a dot in its name: `CFLAGS_<target>` & co. would not survive
# mbx's build-script wrapper (a POSIX sh script), so `cross-arm` passes these
# through the generic TARGET_* variables.
ARM_NEWLIB_FLAGS = "-isystem /usr/include/newlib"

[tasks.submodules]
description = "Check out the CMSIS-NN and ESP-NN submodules (run it after cloning)"
run = "git submodule update --init --recursive"

[tasks.fmt]
description = "Check formatting, of the library workspace, of the emulation firmware and of the train-to-device example"
run = [
  "cargo fmt --all --check",
  # Its own workspace (emulation/Cargo.toml); its clippy runs in test-emulated, which has its
  # bare-metal C toolchains.
  "cargo fmt --check --manifest-path emulation/Cargo.toml",
  # The program of the train-and-deploy tutorial, its own workspace too.
  "cargo fmt --check --manifest-path examples/train-to-device/Cargo.toml",
]

[tasks.clippy]
description = "Run clippy on the workspace, with all and no features"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo clippy --workspace --all-targets",
  "cargo clippy --workspace --all-targets --all-features",
]

[tasks.test]
description = "Run the host test suite, then the golden cases with the ESP-NN backend (ANSI C kernels)"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo test --workspace",
  "cargo test -p nanoglia --features esp-nn --test golden",
  "cargo test -p nanoglia --features alloc --test ownership --test memory",
]

[tasks.oracle]
description = "Regenerate the test models and golden outputs of testdata/ with the LiteRT reference kernels"
dir = "{{config_root}}/tools/oracle"
run = "uv run python -I generate.py"

[tasks.pytorch-export]
description = "Export small PyTorch models (a CNN, an LSTM and a GRU) to int8 LiteRT models with litert-torch, compute their golden outputs with LiteRT's reference kernels and run them with nanoglia (x86_64 Linux or macOS arm64 only: litert-torch has no other wheels)"
# The models and their cases land in target/pytorch-export/<model>, which is not committed.
env.RUSTFLAGS = "-D warnings"
run = [
  "cd tools/oracle && uv run --group torch python -I pytorch_export.py {{config_root}}/target/pytorch-export",
  "NANOGLIA_GOLDEN_DIR={{config_root}}/target/pytorch-export cargo test -p nanoglia --test golden -- --nocapture",
]

[tasks.package]
description = "Package every crate as crates.io would, and build each one from its package"
env.CARGO_TARGET_DIR = "target/package"
# Cargo verifies each crate against the others through a temporary registry with the same path
# and versions on every run, and never re-extracts or rebuilds a registry package it has seen:
# it would keep the sources extracted into $CARGO_HOME/registry/src by an earlier run (the CI
# cache carries that directory between jobs) and verify against an older revision. Start from
# neither. mbx's build-script cache is off for the same reason.
env.MBX_BUILD_SCRIPT_EXECUTION = "false"
run = [
  "rm -rf {{config_root}}/target/package \"${CARGO_HOME:-$HOME/.cargo}\"/registry/src/-*/nanoglia-*",
  "cargo package --workspace",
]

[tasks.coverage]
description = "Coverage of the Rust code of the workspace (tests and golden cases), written to coverage.lcov"
# mbx's build-script wrapper is turned off: llvm-cov reads every binary of the target directory
# and cannot parse it.
env.MBX_BUILD_SCRIPT_EXECUTION = "false"
run = "cargo llvm-cov --workspace --lcov --output-path coverage.lcov"

[tasks.deny]
description = "Check licenses, security advisories, bans and sources of the dependencies (cargo-deny)"
tools = { "aqua:EmbarkStudios/cargo-deny" = "latest" }
run = "cargo deny check"

[tasks.cross-arm]
description = "Build the libraries for Cortex-M0+ (thumbv6m), Cortex-M4F (thumbv7em, Arduino Nano 33 BLE) and Cortex-M33 (thumbv8m.main), without any global allocator"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo build --workspace --lib --target thumbv7em-none-eabihf",
  "cargo build --workspace --lib --target thumbv6m-none-eabi",
  # Generic TARGET_* variables: see ARM_NEWLIB_FLAGS.
  "TARGET_CC=arm-none-eabi-gcc TARGET_AR=arm-none-eabi-ar TARGET_CFLAGS=\"$ARM_NEWLIB_FLAGS\" cargo build --workspace --lib --target thumbv8m.main-none-eabihf",
]

[tasks.cross-riscv32]
description = "Build the libraries for riscv32imc-unknown-none-elf (ESP32-C3 class), without any global allocator"
env.RUSTFLAGS = "-D warnings"
run = "cargo build --workspace --lib --target riscv32imc-unknown-none-elf"

[tasks.install-esp]
description = "Install the Xtensa Rust toolchain (`esp`) and Espressif's GCC with espup, for `cross-esp32s3`"
tools = { "github:esp-rs/espup" = "0.19.0" }
run = "espup install --targets esp32s3"

[tasks.cross-esp32s3]
description = "Build the libraries for the ESP32-S3 (xtensa-esp32s3-none-elf) with ESP-NN's optimized kernels, without any global allocator, and check that no C library references the C heap"
# Needs the Xtensa Rust fork and Espressif's GCC: `mise run install-esp` (espup) installs the `esp`
# rustup toolchain and writes the environment script `$HOME/export-esp.sh` (`ESP_EXPORT`
# overrides its path). CMSIS-NN compiles its portable C code there.
env.RUSTFLAGS = "-D warnings"
env.CARGO_TARGET_DIR = "target/esp"
run = """
. "${ESP_EXPORT:-$HOME/export-esp.sh}"
# The `esp` toolchain through the environment, and mbx called directly: mise's `cargo` wrapper
# would probe the workspace with the stable toolchain, which refuses `-Z` flags.
export RUSTUP_TOOLCHAIN=esp
export CC_xtensa_esp32s3_none_elf=xtensa-esp32s3-elf-gcc AR_xtensa_esp32s3_none_elf=xtensa-esp32s3-elf-ar
mbx build --workspace --lib --target xtensa-esp32s3-none-elf -Zbuild-std=core
mbx build -p nanoglia --lib --target xtensa-esp32s3-none-elf -Zbuild-std=core --features esp-nn
tools/check-no-malloc.sh target/esp
"""

[tasks.cross-wasm32]
description = "Build the libraries for wasm32-unknown-unknown (browsers), without any global allocator"
# CMSIS-NN only needs the declarations of a few C headers (stdint.h, string.h...): they come from
# the wasi-sdk sysroot, nothing links its C library. Task-scoped: wasi-sdk's `bin` has its own
# `clang` and `ar`, which must not shadow the host ones for other tasks.
tools = { "github:WebAssembly/wasi-sdk" = "wasi-sdk-33" }
env.RUSTFLAGS = "-D warnings"
run = """
sdk="$(dirname "$(command -v wasm32-wasip1-clang)")/.."
export CC_wasm32_unknown_unknown=clang AR_wasm32_unknown_unknown=llvm-ar
export CFLAGS_wasm32_unknown_unknown="-isystem $sdk/share/wasi-sysroot/include/wasm32-wasip1"
cargo build --workspace --lib --target wasm32-unknown-unknown
# With SIMD128: the build scripts add -msimd128 to the C code by themselves.
RUSTFLAGS="$RUSTFLAGS -C target-feature=+simd128" CARGO_TARGET_DIR=target/wasm32-simd128 cargo build --workspace --lib --target wasm32-unknown-unknown
"""

[tasks.test-wasip1]
description = "Run the test suite compiled to wasm32-wasip1, under wasmtime"
tools = { "github:WebAssembly/wasi-sdk" = "wasi-sdk-33", wasmtime = "50.0.0" }
env.RUSTFLAGS = "-D warnings"
env.CC_wasm32_wasip1 = "wasm32-wasip1-clang"
env.AR_wasm32_wasip1 = "llvm-ar"
# The golden tests read testdata/ through the repository path compiled into them.
env.CARGO_TARGET_WASM32_WASIP1_RUNNER = "wasmtime --dir={{config_root}}::{{config_root}}"
run = [
  "cargo test --workspace --target wasm32-wasip1 --release",
  # SIMD128 (Rust, and the C code through the build scripts) must give the same bytes.
  "RUSTFLAGS=\"$RUSTFLAGS -C target-feature=+simd128\" CARGO_TARGET_DIR=target/wasip1-simd128 cargo test -p nanoglia --target wasm32-wasip1 --release --test golden --test memory",
]

[tasks.test-emulated]
description = "Run the golden cases of testdata/ on a test-runner firmware under the Unicorn emulator: Cortex-M4F and M33 (CMSIS-NN DSP code paths, checked to execute), M33 without DSP and Cortex-M0+ (no DSP instruction), riscv32imc"
# Its own Cargo workspace (emulation/Cargo.toml) and uv project (emulation/tools/, Python version in
# its .python-version, dependencies locked by uv.lock). Clippy first, for both runtimes (Arm and
# RISC-V). One firmware per target, built and run in turn; run.py prints each case, then the wall
# time of the architecture.
dir = "{{config_root}}/emulation"
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo clippy --release --target thumbv7em-none-eabihf",
  "cargo clippy --release --target riscv32imc-unknown-none-elf",
  "cargo build --release --target thumbv7em-none-eabihf",
  "uv run --locked --project tools python -I tools/run.py --cpu cortex-m4 --expect-dsp target/thumbv7em-none-eabihf/release/nanoglia-emulation",
  # `target-cpu=cortex-m33` turns on the optional DSP extension, for the Rust code and, through
  # nanoglia-cmsis-nn-sys's build script, for CMSIS-NN. Generic TARGET_* variables: see
  # ARM_NEWLIB_FLAGS.
  "RUSTFLAGS=\"$RUSTFLAGS -C target-cpu=cortex-m33\" TARGET_CC=arm-none-eabi-gcc TARGET_AR=arm-none-eabi-ar TARGET_CFLAGS=\"$ARM_NEWLIB_FLAGS\" cargo build --release --target thumbv8m.main-none-eabihf",
  "uv run --locked --project tools python -I tools/run.py --cpu cortex-m33 --expect-dsp target/thumbv8m.main-none-eabihf/release/nanoglia-emulation",
  # The same CPU with the extension turned off, the feature first: the build script must let an
  # explicit `-dsp` win over what the CPU implies, whatever the order, and CMSIS-NN must then
  # compile its portable C code. run.py fails if the ELF holds one DSP instruction. A target
  # directory of its own, not to rebuild the firmware above at each run.
  # rustc warns here that `dsp` is an unstable target feature ("its behavior can change in the future");
  # the warning is not a lint, so `-D warnings` lets it through.
  "RUSTFLAGS=\"$RUSTFLAGS -C target-feature=-dsp -C target-cpu=cortex-m33\" CARGO_TARGET_DIR=target/no-dsp TARGET_CC=arm-none-eabi-gcc TARGET_AR=arm-none-eabi-ar TARGET_CFLAGS=\"$ARM_NEWLIB_FLAGS\" cargo build --release --target thumbv8m.main-none-eabihf",
  "uv run --locked --project tools python -I tools/run.py --cpu cortex-m33 --expect-no-dsp target/no-dsp/thumbv8m.main-none-eabihf/release/nanoglia-emulation",
  # Negative control: the Cortex-M4F firmware must not run on the Cortex-M0 model (Unicorn once ran
  # every Arm firmware on its Cortex-M33, whatever model was asked for).
  "! uv run --locked --project tools python -I tools/run.py --cpu cortex-m0 --filter kws_ref_model/sample_0 target/thumbv7em-none-eabihf/release/nanoglia-emulation > /dev/null 2>&1",
  "cargo build --release --target thumbv6m-none-eabi",
  "uv run --locked --project tools python -I tools/run.py --cpu cortex-m0 --expect-no-dsp target/thumbv6m-none-eabi/release/nanoglia-emulation",
  "cargo build --release --target riscv32imc-unknown-none-elf",
  "uv run --locked --project tools python -I tools/run.py --cpu riscv32 target/riscv32imc-unknown-none-elf/release/nanoglia-emulation",
]

[tasks.no-malloc]
description = "Check that no C library linked into nanoglia, nor the C API's static library, references malloc/calloc/realloc/free"
# Sequential: concurrent builds in the same target directory race under mbx.
run = [
  { task = "cross-arm" },
  { task = "cross-riscv32" },
  { task = "cross-c" },
  "tools/check-no-malloc.sh",
]

[tasks.fuzz]
description = "Fuzz the TFLite reader for a minute, seeded with the MLPerf Tiny models"
tools = { rust = { version = "nightly" }, "cargo:cargo-fuzz" = "latest" }
dir = "{{config_root}}/fuzz"
run = [
  "mkdir -p corpus/parse",
  "cargo fuzz run parse corpus/parse ../testdata/mlperf-tiny -- -max_total_time=60 -max_len=400000",
]

[tasks.msrv]
description = "Check the workspace with the minimum Rust version"
# Keep in sync with `rust-version` in the root Cargo.toml.
tools = { rust = { version = "1.89", targets = "thumbv7em-none-eabihf" } }
env.RUSTFLAGS = "-D warnings"
env.CARGO_TARGET_DIR = "target/msrv"
run = [
  "cargo check --workspace --all-targets",
  "cargo check --workspace --lib --target thumbv7em-none-eabihf",
]

[tasks.doc]
description = "Build the documentation as docs.rs does"
env = { DOCS_RS = "1", RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --workspace"

[tasks.header]
description = "Regenerate the C header crates/nanoglia-c/include/nanoglia.h from the C API (cbindgen)"
# cbindgen publishes Linux binaries only (x86_64 and aarch64).
tools = { "github:mozilla/cbindgen" = { version = "0.29.4", bin = "cbindgen", platforms = { linux-x64 = { asset_pattern = "cbindgen-ubuntu22.04" }, linux-arm64 = { asset_pattern = "cbindgen-ubuntu22.04-aarch64" } } } }
dir = "{{config_root}}/crates/nanoglia-c"
run = "cbindgen --quiet --config cbindgen.toml --output include/nanoglia.h"

[tasks.check-header]
description = "Check that the committed C header is the one cbindgen generates from the C API"
tools = { "github:mozilla/cbindgen" = { version = "0.29.4", bin = "cbindgen", platforms = { linux-x64 = { asset_pattern = "cbindgen-ubuntu22.04" }, linux-arm64 = { asset_pattern = "cbindgen-ubuntu22.04-aarch64" } } } }
dir = "{{config_root}}/crates/nanoglia-c"
run = """
mkdir -p ../../target/c
cbindgen --quiet --config cbindgen.toml --output ../../target/c/nanoglia.h
diff -u include/nanoglia.h ../../target/c/nanoglia.h || { echo 'include/nanoglia.h is out of date: run `mise run header`' >&2; exit 1; }
"""

[tasks.test-c]
description = "Check the C header, build the C library with CMake for the host, run the C tests and the example (CTest), then install it and build the example against the installed package"
# Sequential: concurrent builds in the same target directory race under mbx. CMake runs Cargo in
# target/c/cargo.
run = [
  { task = "check-header" },
  "cmake -S crates/nanoglia-c -B target/c -DCMAKE_BUILD_TYPE=Release",
  "cmake --build target/c",
  "ctest --test-dir target/c --output-on-failure",
  "cmake --install target/c --prefix target/c/install",
  "cmake -S crates/nanoglia-c/tests/package -B target/c/package -DCMAKE_PREFIX_PATH={{config_root}}/target/c/install",
  "cmake --build target/c/package",
  "ctest --test-dir target/c/package --output-on-failure",
]

[tasks.cross-c]
description = "Build the C static library for Cortex-M4F (thumbv7em-none-eabihf) with CMake, without std nor a global allocator, link it into a bare-metal program without any C library, and build the int8-only variant"
env.RUSTFLAGS = "-D warnings"
run = [
  # The archive lands in target/thumbv7em-none-eabihf/release, where `no-malloc` checks it.
  "cmake -S crates/nanoglia-c -B target/c-thumbv7em -DNANOGLIA_CARGO_TARGET=thumbv7em-none-eabihf -DNANOGLIA_CARGO_TARGET_DIR={{config_root}}/target -DNANOGLIA_BUILD_TESTS=OFF -DNANOGLIA_BUILD_EXAMPLES=OFF",
  "cmake --build target/c-thumbv7em",
  "arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 -std=c11 -Wall -Wextra -Werror -Os -ffreestanding -nostdlib -Wl,--gc-sections -Wl,-e,main -Wl,-z,noexecstack -Icrates/nanoglia-c/include crates/nanoglia-c/tests/firmware.c target/thumbv7em-none-eabihf/release/libnanoglia_c.a -o target/c-thumbv7em/firmware.elf",
  "arm-none-eabi-size target/c-thumbv7em/firmware.elf",
  "cargo rustc -p nanoglia-c --release --lib --crate-type staticlib --target thumbv7em-none-eabihf --target-dir target/c-thumbv7em-int8 --no-default-features --features panic-handler,cmsis-nn,kernels",
]

[tasks.check]
description = "Checks to run before pushing"
# Sequential: concurrent builds in the same target directory race under mbx.
run = [
  { task = "fmt" },
  { task = "clippy" },
  { task = "test" },
  { task = "cross-arm" },
]

[tasks.example-nano33ble]
description = "Build the keyword-spotting firmware for the Arduino Nano 33 BLE (run it on the board with `cargo run --release` from examples/nano33ble, through a debug probe)"
dir = "{{config_root}}/examples/nano33ble"
run = [
  "cargo build --release",
  "arm-none-eabi-size target/thumbv7em-none-eabihf/release/nanoglia-example-nano33ble",
]

[tasks.example-train-to-device]
description = "Run the Rust and C programs of the train-and-deploy tutorial (examples/train-to-device) on the committed reference model: every test vector must give LiteRT's bytes"
# The Rust program has its own workspace; CMake runs Cargo in target/c/cargo, as `test-c` does.
env.RUSTFLAGS = "-D warnings"
run = [
  "cargo clippy --release --manifest-path examples/train-to-device/Cargo.toml",
  "cargo run --release --manifest-path examples/train-to-device/Cargo.toml -- examples/train-to-device/reference",
  "cmake -S examples/train-to-device/c -B target/train-to-device/c-reference -DCMAKE_BUILD_TYPE=Release -DNANOGLIA_CARGO_TARGET_DIR={{config_root}}/target/c/cargo",
  "cmake --build target/train-to-device/c-reference",
  "target/train-to-device/c-reference/gesture examples/train-to-device/reference",
]

[tasks.train-to-device]
description = "The train-and-deploy tutorial from start to finish: train the gesture classifier with PyTorch and with Keras, export each to an int8 LiteRT model with test vectors, and run the Rust and C programs on both (x86_64 Linux or macOS arm64 only: litert-torch has no other wheels)"
# The models and their vectors land in target/train-to-device/<track>, which is not committed. Each
# training script fails below 95 % accuracy or if a float operator remains; each program fails
# unless every test vector gives the bytes LiteRT computed.
env.RUSTFLAGS = "-D warnings"
run = """
set -e
for track in pytorch keras; do
  out="{{config_root}}/target/train-to-device/$track"
  uv run --locked --project examples/train-to-device/training --group "$track" python "examples/train-to-device/training/train_$track.py" "$out"
  GESTURE_MODEL="$out/model.tflite" cargo run --release --manifest-path examples/train-to-device/Cargo.toml -- "$out"
  cmake -S examples/train-to-device/c -B "target/train-to-device/c-$track" -DCMAKE_BUILD_TYPE=Release -DGESTURE_DIRECTORY="$out" -DNANOGLIA_CARGO_TARGET_DIR="{{config_root}}/target/c/cargo"
  cmake --build "target/train-to-device/c-$track"
  "target/train-to-device/c-$track/gesture" "$out"
done
"""

[tasks.bench]
description = "Time one inference of each MLPerf Tiny model on the host"
run = "cargo run -q --release -p nanoglia --example bench"

[tasks.bench-compare]
description = "Compare nanoglia with other Rust inference engines on the MLPerf Tiny models: correctness, host time, and size, RAM and output of a keyword-spotting firmware per engine (under a Cortex-M4 emulator)"
dir = "{{config_root}}/benchmarks/compare"
# Its own Cargo workspace (benchmarks/compare/Cargo.toml) and uv project (tools/): prints Markdown
# tables, keeps the raw results in benchmarks/compare/target/compare/. ROUNDS and BENCH_MS change
# the number of runs per engine (3) and the time budget per model and run (2000 ms).
run = "uv run --project tools python -I tools/compare.py"

[tasks.bench-wasm]
description = "Time one inference of each MLPerf Tiny model compiled to wasm32-wasip1 under wasmtime, without and with SIMD128"
tools = { "github:WebAssembly/wasi-sdk" = "wasi-sdk-33", wasmtime = "50.0.0" }
env.CC_wasm32_wasip1 = "wasm32-wasip1-clang"
env.AR_wasm32_wasip1 = "llvm-ar"
env.CARGO_TARGET_WASM32_WASIP1_RUNNER = "wasmtime --dir={{config_root}}::{{config_root}}"
run = [
  "echo '### wasm32 (scalar)'",
  "CARGO_TARGET_DIR=target/bench-wasm-scalar cargo run -q --release -p nanoglia --example bench --target wasm32-wasip1",
  "echo '### wasm32 + simd128'",
  "RUSTFLAGS='-C target-feature=+simd128' CARGO_TARGET_DIR=target/bench-wasm-simd cargo run -q --release -p nanoglia --example bench --target wasm32-wasip1",
]
