[project]
name = "nanonn-oracle"
version = "0.0.0"
description = "Builds nanonn test models and computes golden outputs with the LiteRT reference kernels."
requires-python = ">=3.12,<3.14"
dependencies = [
    "ai-edge-litert>=2.3,<2.4",
    "flatbuffers>=24",
    "numpy",
]

[dependency-groups]
# PyTorch -> LiteRT conversion of realistic models. litert-converter only ships
# x86_64 Linux and macOS arm64 wheels, so this group is optional.
torch = [
    "torch>=2.4,<2.15",
    "litert-torch>=0.10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
