[workspace]
resolver = "3"
members = ["crates/*"]
# The cargo-fuzz crate needs a nightly toolchain and has its own workspace.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
repository = "https://github.com/AlixANNERAUD/nanoglia"
license = "Apache-2.0"

[workspace.dependencies]
nanoglia-core = { version = "0.1.0", path = "crates/nanoglia-core", default-features = false }
nanoglia-tflite = { version = "0.1.0", path = "crates/nanoglia-tflite" }
nanoglia-cmsis-nn = { version = "0.1.0", path = "crates/nanoglia-cmsis-nn", default-features = false }
nanoglia-kernels = { version = "0.1.0", path = "crates/nanoglia-kernels", default-features = false }
allocator-api2 = { version = "0.4", default-features = false }
defmt = "1"
libm = "0.2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
