[package]
name = "nanonn-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nanonn-core = { path = "../crates/nanonn-core" }
nanonn-tflite = { path = "../crates/nanonn-tflite" }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
