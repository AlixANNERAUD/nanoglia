[package]
name = "nanoglia-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nanoglia-core = { path = "../crates/nanoglia-core" }
nanoglia-tflite = { path = "../crates/nanoglia-tflite" }

# Not part of the main workspace: fuzzing needs a nightly toolchain.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
