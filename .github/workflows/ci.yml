name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: clippy
      # Default features, then all of them: the single-rounding mode is built here; its
      # results differ from the golden data by design (generated in double rounding).
      - run: mise run clippy

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests, the golden cases of testdata/ and the memory contract.
          - name: default
            key: default
            args: --workspace
          # int8-only build, as in the Nano 33 BLE firmware.
          - name: int8 only
            key: int8-only
            args: -p nanoglia --no-default-features --features cmsis-nn,kernels,all-ops --lib --test memory
          # The golden cases with the ESP-NN backend first (its ANSI C kernels on the host).
          - name: ESP-NN
            key: esp-nn
            args: -p nanoglia --features esp-nn --test golden
          # Owned models and Arc-shared graphs, behind the `alloc` feature.
          - name: alloc
            key: alloc
            args: -p nanoglia --features alloc --test ownership --test memory
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: test-${{ matrix.key }}
      - run: mise exec -- cargo test ${{ matrix.args }}

  c:
    name: C API (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: c-${{ matrix.compiler }}
      # Checks the header against cbindgen, builds the library with CMake, runs the C tests and
      # the example with CTest, then builds the example against the installed package.
      - run: mise run test-c
      # The Rust and C programs of the train-and-deploy tutorial, on the committed reference model:
      # every test vector must give the bytes LiteRT computed.
      - run: mise run example-train-to-device

  cross:
    name: Cross (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Cortex-M0+, M4F and M33
            task: cross-arm
          - name: riscv32imc
            task: cross-riscv32
          # wasi-sdk and wasmtime come from the task's mise tools.
          - name: wasm32-unknown-unknown
            task: cross-wasm32
          - name: wasm32-wasip1 tests under wasmtime
            task: test-wasip1
          # Builds the Arm and riscv32 libraries and the C API archive, then checks none
          # references the C heap.
          - name: no C heap
            task: no-malloc
          - name: Nano 33 BLE firmware
            task: example-nano33ble
          # The C API's static library for Cortex-M4F, linked without any C library.
          - name: C library for Cortex-M4F
            task: cross-c
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      # C toolchains declared in `[bootstrap.packages]` of mise.toml.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: cross-${{ matrix.task }}
      - run: mise run ${{ matrix.task }}

  # Each `op-*` feature alone, no operator, and the operators of one model: a firmware picks the
  # operators of its models, so each feature must build and work without the others.
  op-features:
    name: Operator features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      # C toolchains declared in `[bootstrap.packages]` of mise.toml, for the Cortex-M4F builds.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: op-features
      - run: mise run op-features

  emulated:
    name: Golden cases emulated (Cortex-M4F, M33, M0+, riscv32imc)
    runs-on: ubuntu-latest
    # Builds and runs take a few minutes; a firmware stuck in a loop stops at run.py's per-case
    # timeout (60 s), this bounds the job as a whole.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      # The C toolchains of `[bootstrap.packages]`: CMSIS-NN, and arm-none-eabi-objdump to find the
      # DSP instructions whose execution the run checks.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: emulated
      # Clippy on emulation/, then a test-runner firmware per target under Unicorn: every case of
      # testdata/, compared as crates/nanoglia/tests/golden.rs does. uv takes Python from
      # emulation/tools/.python-version and the packages from its uv.lock (`--locked`).
      - run: mise run test-emulated

  hardware:
    name: Board runner (host tests, emulated Cortex-M4F, Nano 33 BLE images)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      # The C toolchain of `[bootstrap.packages]`, for CMSIS-NN and arm-none-eabi-size.
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: hardware
      # What runs the golden cases on a board (hardware/), without a board: clippy, the runner on
      # the host behind a link in memory, the tests of the host tool, then every golden case
      # through the protocol on the runner emulated under Unicorn, its ways out of a panic, a
      # fault and a hang, and the dry run of the host tool against a simulated device.
      - run: mise run test-hardware
      # The two images of the Arduino Nano 33 BLE: each must link with real code and its models,
      # and fit in the 960 KiB after the bootloader. No job has the board: `mise run
      # test-hardware-nano33ble` flashes and runs them where it is plugged in.
      - run: mise run build-hardware-nano33ble
      - uses: actions/upload-artifact@v7
        with:
          name: hardware-nano33ble-images
          path: hardware/target/images/*.elf
          if-no-files-found: error

  esp32s3:
    name: Cross (ESP32-S3, ESP-NN optimized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      # The Xtensa Rust toolchain and Espressif's GCC, from espup.
      - run: mise run install-esp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: cross-esp32s3
      # Builds the libraries with ESP-NN's ESP32-S3 kernels, then checks none references the C heap.
      - run: mise run cross-esp32s3

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run deny

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install system packages
        run: sudo apt-get update && mise bootstrap packages apply --yes
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: msrv
      # The task pins its own toolchain (the root `rust-version`).
      - run: mise run msrv

  docs:
    name: Docs (docs.rs mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: docs
      - run: mise run doc

  fuzz:
    name: Fuzz the model reader (1 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run fuzz

  pytorch-export:
    name: PyTorch export (litert-torch, int8)
    # litert-torch's converter ships x86_64 Linux wheels, not aarch64 ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: pytorch-export
      # Converts the models of tools/oracle/pytorch_export.py with the CPU torch of the `torch`
      # dependency group, writes golden outputs with LiteRT's reference kernels, then runs them
      # with nanoglia. The models are not committed: they may change with torch and litert-torch.
      - run: mise run pytorch-export
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytorch-export
          path: target/pytorch-export
          if-no-files-found: ignore

  train-to-device:
    name: Train to device (PyTorch and Keras, int8)
    # litert-torch's converter ships x86_64 Linux wheels, not aarch64 ones.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: train-to-device
      # The train-and-deploy tutorial from start to finish: trains the gesture classifier of
      # examples/train-to-device with PyTorch and with Keras (CPU), exports each to an int8 LiteRT
      # model with test vectors computed by LiteRT's reference kernels, then runs the Rust and C
      # programs on both. Fails below 90 % accuracy, on a float operator, or on an output that
      # differs from LiteRT's. The models are not committed: they change with the frameworks.
      - run: mise run train-to-device
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: train-to-device
          path: |
            target/train-to-device/pytorch
            target/train-to-device/keras
          if-no-files-found: ignore

  # The one check branch protection requires (with `pr-title`, from its own workflow): add a
  # job to `needs` to make it required. `fuzz`, `pytorch-export` and `train-to-device` are left
  # out on purpose: the first is random, the others depend on upstream frameworks and
  # converters (#32).
  required:
    name: Required checks
    if: always()
    needs: [fmt, clippy, test, c, cross, op-features, emulated, hardware, esp32s3, deny, msrv, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job ended with '$result'."
              exit 1
            fi
          done
