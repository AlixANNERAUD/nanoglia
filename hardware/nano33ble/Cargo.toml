[package]
name = "nanoglia-hardware-nano33ble"
description = "The runner of the golden cases on an Arduino Nano 33 BLE (nRF52840), behind its USB serial port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The MLPerf Tiny models linked into the image, which run in place from flash. The five do not fit
# together in the 960 KiB after the bootloader: `mise run build-hardware-nano33ble` builds one
# image per set, and the host tool flashes each in turn.
model-kws = []
model-resnet = []
model-str-ww = []
model-ad = []
model-vww = []
# Turns on the instruction cache of the flash (NVMC `ICACHECNF`). It is off after a reset of the
# chip; the bootloader Arduino publishes turns it on before it starts the application, and on
# one board the firmware found it on without this feature (the guide, "The instruction cache").
# The firmware reports the state it runs with.
icache = []

[dependencies]
nanoglia-hardware-runner.workspace = true
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt.workspace = true
# A HAL is fine here: this firmware is a test bench, not the library. embassy-nrf has the USB
# driver of the nRF52840 that is maintained (VBUS detection, errata), embassy-usb the CDC-ACM
# class. No executor: the firmware polls the two by hand.
# `reset-pin-as-gpio`: without it, `embassy_nrf::init` programs `UICR.PSELRESET` when it finds it
# erased, and resets. With it, `init` wants the register erased: it finds it so or gives up, and
# never writes. The reset button works as the UICR of the board has it, which nothing here changes.
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf52840", "rt", "unstable-pac", "reset-pin-as-gpio"] }
embassy-usb = { version = "0.6", default-features = false }

[lints]
workspace = true
