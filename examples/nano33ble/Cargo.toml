[package]
name = "nanonn-example-nano33ble"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs the MLPerf Tiny keyword-spotting model with nanonn on an Arduino Nano 33 BLE (nRF52840) and reports the inference time."

[dependencies]
nanonn = { path = "../../crates/nanonn", features = ["defmt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "s"

# Standalone firmware, not part of the library workspace.
[workspace]
