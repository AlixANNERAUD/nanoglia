[package]
name = "nanoglia-example-nano33ble"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs the MLPerf Tiny keyword-spotting model with nanoglia on an Arduino Nano 33 BLE (nRF52840) and reports the inference time."

[dependencies]
# To save flash: only the kernels of the six operators of the keyword-spotting model, and, the
# model being int8, neither the float32 nor the int16 kernels (`float`, `int16`).
nanoglia = { path = "../../crates/nanoglia", default-features = false, features = [
  "cmsis-nn",
  "kernels",
  "defmt",
  "op-average-pool-2d",
  "op-conv-2d",
  "op-depthwise-conv-2d",
  "op-fully-connected",
  "op-reshape",
  "op-softmax",
] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
opt-level = "s"

# Standalone firmware, not part of the library workspace.
[workspace]
