[package]
name = "nanoglia-example-train-to-device"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs the gesture classifier of the train-and-deploy tutorial with nanoglia on the test vectors its training scripts export, and checks the outputs against LiteRT's."

[[bin]]
name = "gesture"
path = "src/main.rs"

[dependencies]
# As a firmware would: the two backends, and only the kernels of the operators of the model (those
# of the Keras model, plus DEPTHWISE_CONV_2D and RESHAPE for the PyTorch one). An int8 model: the
# float32 and int16 kernels (`float`, `int16`) are left out too.
nanoglia = { path = "../../crates/nanoglia", default-features = false, features = [
  "cmsis-nn",
  "kernels",
  "op-conv-2d",
  "op-depthwise-conv-2d",
  "op-fully-connected",
  "op-max-pool-2d",
  "op-mean",
  "op-reshape",
  "op-softmax",
] }

# Standalone example, not part of the library workspace.
[workspace]
